<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h2>Ваша корзина</h2>
    <a href="{% url 'book_list' %}">На главную</a>
    <ul>
      {% for item in items %}
        <li>{{ item.book.title }} — {{ item.quantity }} × {{ item.book.price }} руб.</li>
      {% endfor %}
    </ul>
    <p>Итого: {{ total }} руб.</p>
    <form method="post" action="{% url 'checkout' %}">
      {% csrf_token %}
      <button type="submit">Оформить заказ</button>
    </form>
</body>
</html>
